name: Build APK

on:
  push:
    branches: [main, 'claude/**']
    # A release is one deliberate act: pushing a version tag. Nothing else
    # publishes, because a published release installs itself onto every device
    # running the app. The patterns are anchored, so v2.1.0 and v2.1.0-rc1
    # release, while v2.1 or v2.1.0-hotfix do not trigger anything at all.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Branch CI is disposable. A release build is not: never cancel one half way
  # through and leave a tag with no APK behind it.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  # The project pins these in app/build.gradle.kts — keep them in sync.
  NDK_VERSION: '27.2.12479018'
  CMAKE_VERSION: '3.22.1'
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'
  # The release-side half of the updater contract. app/build.gradle.kts exposes
  # the manifest name to the app as BuildConfig.UPDATE_MANIFEST_ASSET.
  UPDATE_MANIFEST: nocturne-update.json
  NOTES_FILE: dist/RELEASE-NOTES.md

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      release: ${{ steps.mode.outputs.release }}
      prerelease: ${{ steps.mode.outputs.prerelease }}
      version: ${{ steps.stage.outputs.version }}
      version_code: ${{ steps.stage.outputs.version_code }}
      apk: ${{ steps.stage.outputs.apk }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK platform, NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      # Library-function signatures (phase 2). Turn a stripped Android binary's
      # SUB_0001a4c0 back into memcpy by shipping a signature database built
      # from the NDK's own bionic + libc++ STATIC archives, one .nsig per ABI.
      #
      # Why a workflow step and not a Gradle task: it MUST NOT be able to break
      # `./gradlew assembleDebug`. Nothing here touches the Gradle graph. The
      # generator (tools/siggen.cpp) is HOST C++ — it runs on this runner, reads
      # the .o members inside each .a and masks the relocated bytes — so it is
      # compiled with the runner's g++, never the NDK. The output is written as
      # a plain asset under app/src/main/assets/libsig/ (gitignored, rebuilt
      # from the NDK every run, never committed), and AGP then packages it like
      # any other asset. If this step is removed or the archives are absent, the
      # assets simply are not there, the engine matcher stays a no-op, and the
      # app is byte-for-byte its phase-1 self.
      #
      # Fails LOUDLY: an ABI whose generation yields zero records errors the
      # build. A shipped-but-empty database would silently name nothing, which
      # is the failure that would reach a device — so it stops the build here.
      - name: Generate bionic library signatures
        run: |
          set -euo pipefail

          # The generator is host C++, not NDK code: build it with the runner's
          # compiler. tools/verify_roundtrip.sh builds it the same way.
          g++ -std=c++17 -O2 tools/siggen.cpp -o "$RUNNER_TEMP/siggen"

          # Locate the NDK we installed above. Prefer the pinned-version path,
          # then whatever the setup action exported.
          ndk=''
          for cand in \
            "${ANDROID_HOME:-}/ndk/${NDK_VERSION}" \
            "${ANDROID_SDK_ROOT:-}/ndk/${NDK_VERSION}" \
            "${ANDROID_NDK_HOME:-}" \
            "${ANDROID_NDK_ROOT:-}" \
            "${ANDROID_NDK_LATEST_HOME:-}"; do
            if [ -n "$cand" ] && [ -d "$cand" ]; then ndk="$cand"; break; fi
          done
          if [ -z "$ndk" ]; then
            echo "::error::Could not locate NDK ${NDK_VERSION}. Looked under \$ANDROID_HOME/ndk, \$ANDROID_SDK_ROOT/ndk, \$ANDROID_NDK_HOME and \$ANDROID_NDK_ROOT."
            exit 1
          fi
          sysroot=$(echo "$ndk"/toolchains/llvm/prebuilt/*/sysroot)
          if [ ! -d "$sysroot" ]; then
            echo "::error::NDK sysroot not found at $ndk/toolchains/llvm/prebuilt/*/sysroot."
            exit 1
          fi
          echo "NDK:     $ndk"
          echo "sysroot: $sysroot"

          # Resolve one static archive for a triple. libc++_static.a and
          # libc++abi.a live at the triple root; libc.a/libm.a/libdl.a live
          # there or under a per-API-level subdir (highest API wins — the
          # archive is only a matching corpus and bionic's code is stable across
          # API levels). Prints the path, or nothing when it is not present.
          resolve() {
            local triple="$1" name="$2" base="$sysroot/usr/lib/$1"
            local best='' best_api=0 d api
            if [ -f "$base/$name" ]; then echo "$base/$name"; return 0; fi
            for d in "$base"/[0-9]*; do
              [ -d "$d" ] || continue
              api=$(basename "$d")
              case "$api" in (*[!0-9]*) continue ;; esac
              if [ -f "$d/$name" ] && { [ -z "$best" ] || [ "$api" -gt "$best_api" ]; }; then
                best="$d/$name"; best_api="$api"
              fi
            done
            [ -n "$best" ] && echo "$best"
            return 0
          }

          mkdir -p app/src/main/assets/libsig
          echo "### Library-function signatures" >> "$GITHUB_STEP_SUMMARY"

          # One comprehensive database per ABI: every static archive present for
          # that triple, fed to siggen in a SINGLE run so cross-library
          # collisions are detected and ambiguous wrappers are left unnamed (the
          # phase-1 collision proof — a thin corpus mislabels wrappers). Ordered
          # arm64-v8a -> aarch64, x86_64 -> x86_64, the two ABIs the app ships.
          gen() {
            local abi="$1" triple="$2"
            local wanted="libc.a libm.a libdl.a libc++_static.a libc++abi.a"
            local inputs=() present='' missing='' n path
            for n in $wanted; do
              path=$(resolve "$triple" "$n")
              if [ -n "$path" ]; then inputs+=("$path"); present="$present $n"; else missing="$missing $n"; fi
            done
            echo "=== $abi ($triple) ==="
            echo "  present:${present:- none}"
            echo "  missing:${missing:- none}"
            if [ ${#inputs[@]} -eq 0 ]; then
              echo "::error::No bionic/libc++ static archives found for $abi under $sysroot/usr/lib/$triple. Expected some of: $wanted. The NDK layout may have changed."
              exit 1
            fi
            local out="app/src/main/assets/libsig/$abi.nsig"
            "$RUNNER_TEMP/siggen" "$out" "${inputs[@]}"

            # Fail loudly on an empty database: read the record count straight
            # from the .nsig header (magic[8] "NOCTSIG1", u32 version, u32 count).
            local records
            records=$(python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(16); sys.stdout.write(str(struct.unpack("<I",d[12:16])[0]) if len(d)>=16 and d[:8]==b"NOCTSIG1" else "BADMAGIC")' "$out")
            if [ "$records" = "BADMAGIC" ]; then
              echo "::error::$out is not a valid .nsig (wrong magic). siggen wrote a file it cannot read back."
              exit 1
            fi
            if [ "${records:-0}" -le 0 ]; then
              echo "::error::siggen produced ZERO records for $abi from$present. A shipped-but-empty database would silently name nothing on every device — refusing to continue. Check the archives above are real ar(1) archives of ELF .o for $triple."
              exit 1
            fi
            echo "  $out: $records records, $(stat -c%s "$out") bytes"
            {
              echo "- \`$abi\` ($triple): **$records** records from$present"
              [ -n "$missing" ] && echo "  - shared-only / not in sysroot:$missing"
            } >> "$GITHUB_STEP_SUMMARY"
            # Deterministic success status: without this the function's exit
            # status is that of the last command above — the [ -n "$missing" ]
            # test, which is FALSE (1) whenever every archive was present, the
            # healthy case — and `set -e` would abort the build on it.
            return 0
          }

          gen arm64-v8a aarch64-linux-android
          gen x86_64    x86_64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Decides, once, what this run is: a release (a version tag, with every
      # signing secret present) or ordinary CI. Every later condition reads this
      # one output instead of re-deriving the answer and drifting from it.
      #
      # Tagging without the secrets fails the run here rather than going green
      # and publishing nothing — a silent non-release is the failure the person
      # cutting it would notice last.
      - name: Decide whether this run publishes a release
        id: mode
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          is_tag=false
          case "$GITHUB_REF" in
            refs/tags/v*) is_tag=true ;;
          esac

          # All four, not just the keystore: half a configuration fails deep
          # inside Gradle with an error that names nothing useful.
          missing=''
          [ -n "$KEYSTORE" ]       || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]      || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]   || missing="$missing RELEASE_KEY_PASSWORD"

          if [ "$is_tag" = true ] && [ -n "$missing" ]; then
            echo "::error::Tag $GITHUB_REF_NAME was pushed, but these repository secrets are unset:$missing. See docs/RELEASE-SIGNING.md. Refusing to cut a release that nobody could install."
            exit 1
          fi

          if [ "$is_tag" = true ]; then
            version="${GITHUB_REF_NAME#v}"

            # Mirrors the rule in app/build.gradle.kts, checked here so a
            # mistyped tag fails in seconds rather than after an hour of NDK
            # build time. rc0 and rc9+ have no room in the versionCode.
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[1-8])?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN with N in 1..8."
              exit 1
            fi

            prerelease=false
            case "$GITHUB_REF_NAME" in *-rc*) prerelease=true ;; esac
            {
              echo "release=true"
              echo "prerelease=$prerelease"
              echo "version_name=$version"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Release run for $GITHUB_REF_NAME."
          else
            {
              echo "release=false"
              echo "prerelease=false"
              # Empty: app/build.gradle.kts then falls back to baseVersionName.
              echo "version_name="
            } >> "$GITHUB_OUTPUT"
            if [ -n "$missing" ]; then
              echo "::notice::Release signing secrets are not all set — building the debug APK only."
            fi
          fi

      # Only the binary keystore reaches the disk. The passwords stay in the
      # environment of the Gradle step, so there is no file that could be read,
      # cached or committed, and no .properties escaping to mangle them.
      - name: Materialise release keystore
        if: steps.mode.outputs.release == 'true'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 -d > app/nocturne-release.jks

          # Confirm the secret decoded to a keystore before spending an hour of
          # NDK build time on it. PKCS#12 starts 30 82 (DER SEQUENCE), the older
          # JKS format starts FE ED FE ED. Four header bytes are not a secret.
          magic=$(head -c 4 app/nocturne-release.jks | od -An -tx1 | tr -d ' \n')
          case "$magic" in
            3082*|feedfeed) ;;
            *)
              echo "::error::RELEASE_KEYSTORE_BASE64 did not decode to a keystore. Re-encode it with: base64 -w0 nocturne-release.jks"
              exit 1
              ;;
          esac

          # Prove, on every release, that git would refuse to track it.
          if ! git check-ignore -q app/nocturne-release.jks; then
            echo "::error::app/nocturne-release.jks is not covered by .gitignore."
            exit 1
          fi
          echo "Keystore decoded ($(stat -c%s app/nocturne-release.jks) bytes)."

      # Skipped on a release run: the release APK is the only artifact a tag
      # produces, and building both doubles an already long NDK build for an APK
      # that must never be published anyway.
      - name: Build debug APK
        if: steps.mode.outputs.release != 'true'
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" assembleDebug

      - name: Build release APK
        if: steps.mode.outputs.release == 'true'
        env:
          NOCTURNE_VERSION_NAME: ${{ steps.mode.outputs.version_name }}
          NOCTURNE_REQUIRE_SIGNING: 'true'
          NOCTURNE_KEYSTORE_FILE: nocturne-release.jks
          NOCTURNE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          NOCTURNE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          NOCTURNE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" assembleRelease

      - name: Stage APKs
        id: stage
        env:
          IS_RELEASE: ${{ steps.mode.outputs.release }}
        run: |
          set -euo pipefail
          mkdir -p dist
          aapt2="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"

          # The version is read back out of the APK that was actually built, not
          # recomputed from the tag. Published metadata that disagrees with the
          # APK is worse than no metadata, and this is the only way to be sure.
          badging_of() { "$aapt2" dump badging "$1" | head -n 1; }
          field() { printf '%s' "$1" | grep -o "$2='[^']*'" | head -n1 | cut -d"'" -f2; }

          if [ "$IS_RELEASE" = 'true' ]; then
            src=app/build/outputs/apk/release/app-release.apk
            if [ ! -f "$src" ]; then
              # AGP names the output app-release-unsigned.apk when no signing
              # config applied. Reaching here means the release built without
              # the keystore.
              echo "::error::$src is missing. The release build produced no signed APK. Present instead: $(find app/build/outputs/apk/release -maxdepth 1 -type f -printf '%f ' 2>/dev/null)"
              exit 1
            fi
            b=$(badging_of "$src")
            version=$(field "$b" versionName)
            version_code=$(field "$b" versionCode)
            apk="Nocturne-${version}.apk"
            cp "$src" "dist/$apk"

            # The digest ships as its own file, never inside the APK it
            # describes. sha256sum -c reads this as-is.
            ( cd dist && sha256sum "$apk" > "${apk}.sha256" )
          else
            src=app/build/outputs/apk/debug/app-debug.apk
            b=$(badging_of "$src")
            version=$(field "$b" versionName)
            version_code=$(field "$b" versionCode)
            apk="Nocturne-v${version}-$(git rev-parse --short HEAD)-debug.apk"
            cp "$src" "dist/$apk"
            ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
          fi

          # Nothing that is not meant to leave this runner may sit in dist/.
          leaked=$(find dist -maxdepth 1 -type f \
            \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.properties' \))
          if [ -n "$leaked" ]; then
            echo "::error::Signing material in dist/ ($leaked) — refusing to upload."
            exit 1
          fi

          {
            echo "version=$version"
            echo "version_code=$version_code"
            echo "apk=$apk"
          } >> "$GITHUB_OUTPUT"

          # The backticks below are markdown for the job summary, not command
          # substitution, so the single quotes are deliberate.
          # shellcheck disable=SC2016
          {
            echo "### APKs"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|------|------|---------|"
            for f in dist/*.apk; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" \
                "$(sha256sum "$f" | cut -c1-16)..."
            done
            echo
            echo 'Install with `adb install -r <file>.apk`, or copy it to the phone and open it.'
          } >> "$GITHUB_STEP_SUMMARY"

      # R8 and release signing have never run on this project before this
      # workflow. Assert the result rather than assume it: an APK signed with the
      # throwaway debug key installs for whoever built it and then permanently
      # blocks every future update for everyone who installed it.
      - name: Verify the release signature
        id: signature
        if: steps.mode.outputs.release == 'true'
        env:
          APK: ${{ steps.stage.outputs.apk }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          apk="dist/$APK"

          if ! out=$("$apksigner" verify --print-certs -v "$apk" 2>&1); then
            printf '%s\n' "$out"
            echo "::error::apksigner could not verify $apk."
            exit 1
          fi
          printf '%s\n' "$out"

          if ! printf '%s' "$out" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'; then
            echo "::error::$apk carries no v2 signature."
            exit 1
          fi
          if printf '%s' "$out" | grep -q 'CN=Android Debug'; then
            echo "::error::$apk is signed with the Android debug key, not the release key."
            exit 1
          fi

          signer=$(printf '%s' "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          if [ -z "$signer" ]; then
            echo "::error::Could not read the signing certificate digest from apksigner."
            exit 1
          fi
          echo "signer=$signer" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "### Signature"
            echo
            echo "Signing certificate SHA-256: \`$signer\`"
            echo
            echo "This must stay the same for every release. A different value means the"
            echo "keystore changed and no existing install can take the update."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write release notes and update manifest
        if: steps.mode.outputs.release == 'true'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.stage.outputs.version }}
          VERSION_CODE: ${{ steps.stage.outputs.version_code }}
          APK: ${{ steps.stage.outputs.apk }}
          SIGNER: ${{ steps.signature.outputs.signer }}
          PRERELEASE: ${{ steps.mode.outputs.prerelease }}
        run: |
          set -euo pipefail

          # The notes are whatever the person cutting the release wrote in the
          # annotated tag. That is the one place they are certain to be writing
          # for a human, and it is fixed before the build starts.
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          git for-each-ref "refs/tags/${TAG}" --format='%(contents)' \
            | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            git log -1 --pretty=%B > "$NOTES_FILE"
          fi

          # package:, sdkVersion: and native-code: each land on their own line.
          aapt2="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"
          "$aapt2" dump badging "dist/$APK" \
            | grep -E "^(package|sdkVersion|native-code):" > /tmp/badging.txt
          cat /tmp/badging.txt

          # Assembled by python so that quotes, backslashes and newlines in the
          # notes cannot produce invalid JSON on the one file the app parses.
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess

          apk = os.environ["APK"]
          path = os.path.join("dist", apk)
          badging = open("/tmp/badging.txt", encoding="utf-8").read()

          def one(pattern, default=""):
              m = re.search(pattern, badging, re.M)
              return m.group(1) if m else default

          notes = open(os.environ["NOTES_FILE"], encoding="utf-8").read().strip()
          if len(notes) > 2000:
              notes = notes[:2000].rstrip() + "\n..."

          digest = hashlib.sha256()
          with open(path, "rb") as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b""):
                  digest.update(chunk)

          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          native = re.search(r"^native-code: (.*)", badging, re.M)
          abis = re.findall(r"'([^']+)'", native.group(1)) if native else []

          manifest = {
              # Bump when the shape changes. An updater that does not know a
              # schema should decline the update rather than guess at it.
              "schema": 1,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION"],
              "tag": tag,
              "commit": os.environ["GITHUB_SHA"],
              "releasedAt": subprocess.check_output(
                  ["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"], text=True).strip(),
              "prerelease": os.environ["PRERELEASE"] == "true",
              "minSdk": int(one(r"^sdkVersion:'(\d+)'", "0")),
              "abis": abis,
              "apk": {
                  "name": apk,
                  "size": os.path.getsize(path),
                  "sha256": digest.hexdigest(),
                  "signerSha256": os.environ["SIGNER"],
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{apk}",
              },
              "releaseUrl": f"https://github.com/{repo}/releases/tag/{tag}",
              "notes": notes,
          }
          with open(os.path.join("dist", os.environ["UPDATE_MANIFEST"]), "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY

          echo "::group::$UPDATE_MANIFEST"
          cat "dist/$UPDATE_MANIFEST"
          echo "::endgroup::"

          # The digest in the manifest and the digest in the sidecar are computed
          # independently; they have to agree or the updater and a human checking
          # by hand would reach different conclusions.
          from_manifest=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["apk"]["sha256"])' "dist/$UPDATE_MANIFEST")
          from_sidecar=$(cut -d' ' -f1 < "dist/${APK}.sha256")
          if [ "$from_manifest" != "$from_sidecar" ]; then
            echo "::error::Manifest and sidecar digests disagree."
            exit 1
          fi

      - name: Inspect APK
        run: |
          aapt2="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"
          for apk in dist/*.apk; do
            echo "::group::$(basename "$apk")  ($(du -h "$apk" | cut -f1))"
            "$aapt2" dump badging "$apk" | grep -E \
              '^package|^sdkVersion|^targetSdkVersion|^application-label|^application-icon|^launchable-activity|^native-code'
            echo "--- launcher icon resources packaged ---"
            unzip -l "$apk" | grep -E 'ic_launcher' || echo 'NONE FOUND'
            echo "--- native libs ---"
            unzip -l "$apk" | grep -E '\.so$'
            echo "::endgroup::"
          done

      - name: Upload debug APK
        if: steps.mode.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-debug-apk
          path: |
            dist/*debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # Named files, not a glob: the publish job downloads exactly this artifact
      # and attaches exactly these assets. Nothing else can ride along.
      - name: Upload release bundle
        if: steps.mode.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-release
          path: |
            dist/${{ steps.stage.outputs.apk }}
            dist/${{ steps.stage.outputs.apk }}.sha256
            dist/${{ env.UPDATE_MANIFEST }}
            dist/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 90

      # The crackme test target is a by-product of the native compile, left at
      # app/build/crackme/<abi>/crackme by the CMake target. It also travels
      # inside the APK's assets; this publishes it on its own so it can be pushed
      # to a device and run under adb, or opened in Nocturne as an imported file
      # rather than only through the bundled loader. Fails loudly when the native
      # build produced nothing, the same stance as the in-build copy task — a red
      # run with a cause, not a silently empty artifact. Runs in both variants
      # because the native build (and so the crackme) is built in both.
      - name: Stage crackme test target
        run: |
          set -euo pipefail
          mkdir -p dist/crackme
          missing=''
          for abi in arm64-v8a x86_64; do
            src="app/build/crackme/$abi/crackme"
            if [ -f "$src" ]; then
              cp "$src" "dist/crackme/crackme-$abi"
            else
              missing="$missing $abi"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::crackme test target missing for:$missing. Expected app/build/crackme/<abi>/crackme from the native build — see app/src/main/cpp/CMakeLists.txt."
            exit 1
          fi
          ( cd dist/crackme && sha256sum crackme-* > SHA256SUMS.txt )
          # The backticks below are job-summary markdown, not command substitution.
          # shellcheck disable=SC2016
          {
            echo "### Crackme test target"
            echo
            echo "ELF executables, not APKs. Push to a device and run under a shell"
            echo '(`adb push crackme-arm64-v8a /data/local/tmp/ && adb shell chmod +x /data/local/tmp/crackme-arm64-v8a`),'
            echo "or open one in Nocturne as an imported file. The same binary ships"
            echo "inside the APK under assets/samples/."
            echo
            echo "| File | Size | SHA-256 |"
            echo "|------|------|---------|"
            for f in dist/crackme/crackme-*; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" \
                "$(sha256sum "$f" | cut -c1-16)..."
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload crackme test target
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-crackme
          path: |
            dist/crackme/crackme-arm64-v8a
            dist/crackme/crackme-x86_64
            dist/crackme/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          rm -f app/nocturne-release.jks app/keystore.properties
          rm -rf app/build/intermediates/signing_config \
                 app/build/intermediates/signing_config_versions
          if [ -e app/nocturne-release.jks ]; then
            echo "::error::Failed to remove the keystore from the runner."
            exit 1
          fi

  release:
    name: Attach APKs to GitHub Release
    needs: build
    # Not "is this a tag". The build job already decided, and it only says true
    # when a version tag was pushed AND every signing secret was present AND a
    # release APK came out the far end. Gating on the tag alone would publish
    # whatever artifacts happened to exist — including a debug-signed APK, which
    # would then block every future update on any device that installed it.
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Add a required reviewer under Settings > Environments > release to hold
    # every publish for a human approval. Undefined, this is a no-op.
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      APK: ${{ needs.build.outputs.apk }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}

    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@v4
        with:
          name: Nocturne-release
          path: dist

      - name: Refuse to publish an update that goes backwards
        run: |
          set -euo pipefail
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$prev" ] || [ "$prev" = "$TAG" ]; then
            echo "No earlier published release to compare against."
            exit 0
          fi
          rm -rf prev && mkdir -p prev
          gh release download "$prev" -p "$UPDATE_MANIFEST" -D prev 2>/dev/null || true
          if [ ! -f "prev/$UPDATE_MANIFEST" ]; then
            echo "Release $prev carries no $UPDATE_MANIFEST — nothing to compare."
            exit 0
          fi
          prev_code=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["versionCode"])' "prev/$UPDATE_MANIFEST")
          echo "Latest published: $prev (versionCode $prev_code). This run: $TAG (versionCode $VERSION_CODE)."
          if [ "$VERSION_CODE" -le "$prev_code" ]; then
            echo "::error::versionCode $VERSION_CODE is not greater than the published $prev_code. Every device on $prev would ignore this release. Tag a higher version."
            exit 1
          fi

      - name: Publish release
        run: |
          set -euo pipefail
          files=("dist/$APK" "dist/${APK}.sha256" "dist/$UPDATE_MANIFEST")
          for f in "${files[@]}" dist/RELEASE-NOTES.md; do
            [ -f "$f" ] || { echo "::error::$f is missing from the build artifact."; exit 1; }
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a release that already exists: replace the assets in
            # place rather than failing. Same tag, same inputs, same versionCode.
            echo "Release $TAG already exists — replacing its assets."
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            args=(--verify-tag --title "Nocturne $VERSION"
                  --notes-file dist/RELEASE-NOTES.md --generate-notes)
            if [ "$PRERELEASE" = 'true' ]; then
              # GitHub excludes prereleases from /releases/latest, so the
              # updater never offers a release candidate to an ordinary user.
              args+=(--prerelease)
            else
              args+=(--latest)
            fi
            gh release create "$TAG" "${args[@]}" "${files[@]}"
          fi

          {
            echo "### Released"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- versionName: \`$VERSION\`  versionCode: \`$VERSION_CODE\`"
            echo "- https://github.com/$GH_REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
